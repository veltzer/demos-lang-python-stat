[project]
name = "demos-lang-python-stat"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "scipy-stubs",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
search-path = [
    "src",
    ".",
]

[tool.pyrefly.errors]
no-any-return = "error"
